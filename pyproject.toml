[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finitewave"
version = "0.8.5"
requires-python = ">=3.11,<3.14"
authors = [
  { name="Timur Nezlobinsky", email="nezlobinsky@gmail.com" },
  { name="Arstanbek Okenov", email="arstanbek.okenov@ugent.be" }
]
description = "Simple package for a wide range of tasks in modeling cardiac electrophysiology using finite-difference methods."
readme = "README.rst"
license = "MIT"

dependencies = [
  "numpy==2.1.3",
  "numba==0.61.2",
  "llvmlite==0.44.0",
  "scipy==1.16.3",
  "matplotlib==3.10.0",
  "tqdm==4.67.3",
  "natsort==8.4.0",
  "pyvista==0.49.1",
  "av==18.1.0",
  "imageio==2.38.0",
  "scikit-image==0.25.2",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov"
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "pydata-sphinx-theme",
  "sphinx-gallery",
  "sphinx-copybutton",
  "numpydoc",
]

